<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ivié · App and messaging</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&amp;family=Manrope:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<script src="./ivie-data.js"></script>
<style>
html,body{margin:0;background:#2B211B;-webkit-font-smoothing:antialiased;}
a{color:#F6F1EA;}
a:hover{color:#D9D0C4;}
:focus-visible{outline:2px solid #A8865A;outline-offset:3px;}
@keyframes ivie-up{from{transform:translateY(100%)}to{transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:1ms !important;animation-delay:0ms !important;animation-iteration-count:1 !important;transition-duration:1ms !important;scroll-behavior:auto !important;}}
</style>
</helmet>
<div style="min-height:100vh;background:#2B211B;color:#F6F1EA;font-family:'Manrope',sans-serif;padding:clamp(28px,4vw,56px) clamp(20px,5vw,72px) 72px;box-sizing:border-box;">
  <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;max-width:1400px;margin:0 auto;">
    <span style="font-size:11px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;color:#D9D0C4;">Client Experience · App and messaging</span>
    <div style="display:flex;flex-wrap:wrap;gap:4px 24px;">
      <a href="/ivie-app" style="display:inline-flex;align-items:center;min-height:44px;font-size:13px;text-decoration:none;"><span style="border-bottom:1px solid #A8865A;padding-bottom:3px;">Open the app view</span></a>
      <a href="/account" style="display:inline-flex;align-items:center;min-height:44px;font-size:13px;text-decoration:none;"><span style="border-bottom:1px solid #A8865A;padding-bottom:3px;">Account</span></a>
      <a href="/prototype-hub" style="display:inline-flex;align-items:center;min-height:44px;font-size:13px;text-decoration:none;"><span style="border-bottom:1px solid #A8865A;padding-bottom:3px;">Hub</span></a>
    </div>
  </div>
  <h1 style="max-width:1400px;margin:clamp(40px,6vw,80px) auto clamp(40px,5vw,64px);font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(48px,7vw,104px);line-height:0.95;letter-spacing:-0.015em;">Ivié, in her pocket.</h1>

  <section style="max-width:1400px;margin:0 auto clamp(64px,8vw,112px);display:flex;flex-direction:column;gap:28px;">
    <div style="display:flex;flex-direction:column;gap:8px;padding-top:20px;border-top:1px solid rgba(217,208,196,0.25);"><span style="font-size:11px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;color:#D9D0C4;">01 · Install</span><h2 style="margin:0;font-family:'Cormorant Garamond',serif;font-weight:400;font-size:clamp(30px,3vw,42px);">Add to home screen, and the app it becomes</h2></div>
    <div style="display:flex;flex-wrap:wrap;gap:clamp(24px,3vw,48px);align-items:flex-start;">
      <sc-for list="{{ installs }}" as="ins" hint-placeholder-count="2">
        <figure style="margin:0;display:flex;flex-direction:column;gap:14px;">
          <div style="width:300px;height:620px;box-sizing:border-box;border-radius:40px;padding:10px;background:#141210;border:1px solid rgba(217,208,196,0.3);">
            <div style="position:relative;width:100%;height:100%;border-radius:31px;overflow:hidden;background:#F6F1EA;color:#141210;">
              <img src="https://images.pexels.com/videos/39347032/pexels-photo-39347032.jpeg?auto=compress&amp;w=700" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(0.9) contrast(1.02) sepia(0.06);">
              <span style="position:absolute;top:44px;left:0;right:0;text-align:center;font-family:'Cormorant Garamond',serif;font-size:18px;letter-spacing:0.42em;padding-left:0.42em;color:#F6F1EA;">IVIÉ</span>
              <span aria-hidden="true" style="position:absolute;inset:0;background:rgba(20,18,16,0.45);"></span>
              <div style="position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:14px;padding:12px 20px 26px;background:#FBF8F3;border-radius:18px 18px 0 0;animation:ivie-up 800ms cubic-bezier(0.22,1,0.36,1) both;">
                <span style="align-self:center;width:36px;height:4px;border-radius:2px;background:#D9D0C4;"></span>
                <div style="display:flex;align-items:center;gap:12px;">
                  <span style="flex:0 0 52px;height:52px;border-radius:12px;background:#141210;color:#F6F1EA;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:12px;letter-spacing:0.3em;padding-left:0.3em;box-sizing:border-box;">IVIÉ</span>
                  <span style="font-family:'Cormorant Garamond',serif;font-size:23px;line-height:1.1;">Add Ivié to your home screen</span>
                </div>
                <span style="font-size:12px;line-height:1.6;color:#2B211B;">Open in one tap. Collection updates, fittings and private previews, without the browser.</span>
                <sc-if value="{{ ins.ios }}" hint-placeholder-val="{{ true }}">
                  <div style="display:flex;flex-direction:column;border-top:1px solid #D9D0C4;">
                    <span style="display:flex;align-items:center;gap:12px;min-height:44px;border-bottom:1px solid #D9D0C4;font-size:12px;"><span style="font-family:'Cormorant Garamond',serif;font-size:16px;color:#6B6056;">1</span><span style="flex:1;">Tap Share in the Safari toolbar</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M8 9H6v11h12V9h-2M12 3v12M8.5 6.5L12 3l3.5 3.5"></path></svg></span>
                    <span style="display:flex;align-items:center;gap:12px;min-height:44px;border-bottom:1px solid #D9D0C4;font-size:12px;"><span style="font-family:'Cormorant Garamond',serif;font-size:16px;color:#6B6056;">2</span><span style="flex:1;">Choose Add to Home Screen</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 5h14v14H5zM12 9v6M9 12h6"></path></svg></span>
                    <span style="display:flex;align-items:center;gap:12px;min-height:44px;border-bottom:1px solid #D9D0C4;font-size:12px;"><span style="font-family:'Cormorant Garamond',serif;font-size:16px;color:#6B6056;">3</span><span style="flex:1;">Tap Add. Ivié joins your apps</span></span>
                  </div>
                  <button style="min-height:44px;background:none;border:1px solid #141210;border-radius:2px;font-family:'Manrope',sans-serif;font-size:11px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;color:#141210;cursor:pointer;">I have done it</button>
                </sc-if>
                <sc-if value="{{ ins.android }}" hint-placeholder-val="{{ false }}">
                  <a href="/ivie-app" style="display:flex;align-items:center;justify-content:center;min-height:48px;background:#141210;color:#F6F1EA;border-radius:2px;font-size:11px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;text-decoration:none;">Install Ivié</a>
                  <span style="display:flex;align-items:center;gap:10px;font-size:12px;line-height:1.5;color:#2B211B;"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="flex-shrink:0;"><circle cx="12" cy="5" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="12" cy="19" r="1.6"></circle></svg>No button? Open the Chrome menu and choose Add to home screen.</span>
                  <span style="font-size:11px;color:#6B6056;">Under 1 MB. No app store needed.</span>
                </sc-if>
                <span style="align-self:center;font-size:12px;color:#6B6056;">Not now</span>
              </div>
            </div>
          </div>
          <figcaption style="font-size:12px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;color:#D9D0C4;">{{ ins.label }}</figcaption>
        </figure>
      </sc-for>
      <figure style="margin:0;display:flex;flex-direction:column;gap:14px;">
        <div style="width:300px;height:620px;box-sizing:border-box;border-radius:40px;padding:10px;background:#141210;border:1px solid rgba(217,208,196,0.3);">
          <div style="position:relative;width:100%;height:100%;border-radius:31px;overflow:hidden;background:#F6F1EA;">
            <iframe src="/ivie-app" title="The installed Ivié app" loading="lazy" style="position:absolute;top:0;left:0;width:390px;height:836px;border:0;transform:scale(0.718);transform-origin:0 0;background:#F6F1EA;"></iframe>
          </div>
        </div>
        <figcaption style="display:flex;justify-content:space-between;gap:12px;"><span style="font-size:12px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;color:#D9D0C4;">Installed · Live</span><a href="/ivie-app" style="font-size:12px;text-decoration:none;"><span style="border-bottom:1px solid #A8865A;padding-bottom:2px;">Open full size</span></a></figcaption>
      </figure>
    </div>
  </section>

  <section style="max-width:1400px;margin:0 auto clamp(64px,8vw,112px);display:flex;flex-direction:column;gap:28px;">
    <div style="display:flex;flex-direction:column;gap:8px;padding-top:20px;border-top:1px solid rgba(217,208,196,0.25);"><span style="font-size:11px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;color:#D9D0C4;">02 · Notifications</span><h2 style="margin:0;font-family:'Cormorant Garamond',serif;font-weight:400;font-size:clamp(30px,3vw,42px);">Few, and always worth opening</h2></div>
    <div style="display:flex;flex-wrap:wrap;gap:clamp(24px,3vw,48px);">
      <sc-for list="{{ locks }}" as="l" hint-placeholder-count="3">
        <figure style="margin:0;display:flex;flex-direction:column;gap:14px;">
          <div style="width:300px;height:620px;box-sizing:border-box;border-radius:40px;padding:10px;background:#141210;border:1px solid rgba(217,208,196,0.3);">
            <div style="position:relative;width:100%;height:100%;border-radius:31px;overflow:hidden;background:#2B211B;">
              <img src="{{ l.wall }}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:{{ l.pos }};filter:saturate(0.8) brightness(0.62) sepia(0.1);">
              <div style="position:absolute;top:72px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:4px;color:#F6F1EA;">
                <span style="font-size:14px;font-weight:500;line-height:1.2;margin-bottom:6px;">Friday 13 November</span>
                <span style="font-size:76px;font-weight:300;line-height:1;letter-spacing:-0.02em;">{{ l.time }}</span>
              </div>
              <a href="{{ l.href }}" target="_top" style="position:absolute;left:10px;right:10px;top:250px;display:flex;gap:10px;padding:12px;background:rgba(246,241,234,0.9);border-radius:18px;color:#141210;text-decoration:none;box-shadow:0 8px 24px rgba(20,18,16,0.2);" style-hover="background:#FBF8F3;color:#141210;">
                <span style="flex:0 0 36px;height:36px;border-radius:9px;background:#141210;color:#F6F1EA;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:9px;letter-spacing:0.24em;padding-left:0.24em;box-sizing:border-box;">IVIÉ</span>
                <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;">
                  <span style="display:flex;justify-content:space-between;gap:8px;font-size:11px;color:#6B6056;"><span style="font-weight:600;letter-spacing:0.08em;">IVIÉ</span><span>{{ l.ago }}</span></span>
                  <span style="font-size:14px;font-weight:600;line-height:1.3;">{{ l.title }}</span>
                  <span style="font-size:13px;line-height:1.4;color:#2B211B;">{{ l.body }}</span>
                </span>
              </a>
              <span style="position:absolute;bottom:10px;left:50%;width:110px;height:4px;margin-left:-55px;border-radius:2px;background:rgba(246,241,234,0.85);"></span>
            </div>
          </div>
          <figcaption style="font-size:12px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;color:#D9D0C4;">{{ l.cap }}</figcaption>
        </figure>
      </sc-for>
    </div>
  </section>

  <section style="max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:28px;">
    <div style="display:flex;flex-direction:column;gap:8px;padding-top:20px;border-top:1px solid rgba(217,208,196,0.25);"><span style="font-size:11px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;color:#D9D0C4;">03 · Where she already is</span><h2 style="margin:0;font-family:'Cormorant Garamond',serif;font-weight:400;font-size:clamp(30px,3vw,42px);">WhatsApp and Instagram</h2></div>
    <div style="display:flex;flex-wrap:wrap;gap:clamp(24px,3vw,48px);">
      <figure style="margin:0;display:flex;flex-direction:column;gap:14px;">
        <div style="width:300px;height:620px;box-sizing:border-box;border-radius:40px;padding:10px;background:#141210;border:1px solid rgba(217,208,196,0.3);">
          <div style="position:relative;width:100%;height:100%;border-radius:31px;overflow:hidden;background:#ECE4D8;color:#141210;display:flex;flex-direction:column;">
            <div style="flex-shrink:0;display:flex;align-items:center;gap:10px;padding:40px 14px 10px;background:#FBF8F3;border-bottom:1px solid #D9D0C4;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><polyline points="15 5 8 12 15 19"></polyline></svg>
              <span style="flex:0 0 34px;height:34px;border-radius:50%;background:#141210;color:#F6F1EA;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:8px;letter-spacing:0.2em;padding-left:0.2em;box-sizing:border-box;">IVIÉ</span>
              <span style="display:flex;flex-direction:column;gap:1px;"><span style="font-size:13px;font-weight:600;">Ivié East Legon</span><span style="font-size:10px;color:#6B6056;">Business account · Esi and team</span></span>
            </div>
            <div style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:12px 10px;">
              <span style="flex-shrink:0;align-self:center;padding:3px 10px;border-radius:6px;background:rgba(251,248,243,0.8);font-size:10px;color:#6B6056;">Tuesday 6 October</span>
              <div style="flex-shrink:0;align-self:flex-start;max-width:86%;background:#FBF8F3;border-radius:2px 10px 10px 10px;overflow:hidden;box-shadow:0 1px 1px rgba(20,18,16,0.06);">
                <div style="position:relative;flex-shrink:0;height:120px;background:#D9D0C4;"><img src="https://images.unsplash.com/photo-1594737996820-af7654631790?w=600&amp;q=80&amp;auto=format&amp;fit=crop" alt="Adwoa Silk Slip Dress in champagne" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(0.9) contrast(1.02) sepia(0.06);"></div>
                <div style="display:flex;flex-direction:column;gap:4px;padding:10px 12px 6px;font-size:12px;line-height:1.45;">
                  <span style="font-weight:600;">Order confirmed · IV-30418</span>
                  <span>Thank you, Akua. Your Adwoa Silk Slip Dress (Champagne, M) is reserved.</span>
                  <span style="color:#2B211B;">GHS 3,850 · Paid with MTN MoMo</span>
                  <span style="color:#2B211B;">We will message you here the moment it is ready at East Legon.</span>
                  <span style="flex-shrink:0;align-self:flex-end;font-size:9px;color:#6B6056;">10:24</span>
                </div>
                <a href="/account?v=orders" target="_top" style="display:flex;align-items:center;justify-content:center;min-height:38px;border-top:1px solid #D9D0C4;font-size:12px;font-weight:500;color:#141210;text-decoration:none;">View order</a>
                <a href="/book-a-visit?store=East%20Legon&amp;purpose=collection" target="_top" style="display:flex;align-items:center;justify-content:center;min-height:38px;border-top:1px solid #D9D0C4;font-size:12px;font-weight:500;color:#141210;text-decoration:none;">Book a collection time</a>
              </div>
              <div style="flex-shrink:0;align-self:flex-start;max-width:86%;display:flex;flex-direction:column;gap:3px;padding:8px 12px 6px;background:#FBF8F3;border-radius:2px 10px 10px 10px;box-shadow:0 1px 1px rgba(20,18,16,0.06);">
                <span style="font-size:11px;font-weight:600;color:#8A5F3A;">Esi · Your stylist</span>
                <span style="font-size:12px;line-height:1.5;">Hello Akua, it is Esi. I steamed your slip myself this morning, and the champagne is even lovelier in person. I have put the ink crepe blazer aside too, in case you would like to try them together on Saturday. No pressure at all.</span>
                <span style="flex-shrink:0;align-self:flex-end;font-size:9px;color:#6B6056;">11:02</span>
              </div>
              <div style="flex-shrink:0;align-self:flex-end;max-width:80%;display:flex;flex-direction:column;gap:3px;padding:8px 12px 6px;background:#D8C3A0;border-radius:10px 2px 10px 10px;">
                <span style="font-size:12px;line-height:1.5;">Esi, thank you. Yes please, I will come on Saturday around 2.</span>
                <span style="flex-shrink:0;align-self:flex-end;font-size:9px;color:#2B211B;">11:15</span>
              </div>
            </div>
            <div style="flex-shrink:0;display:flex;align-items:center;gap:8px;padding:8px 10px 22px;background:#FBF8F3;">
              <span style="flex:1;height:34px;border-radius:17px;background:#F6F1EA;border:1px solid #D9D0C4;display:flex;align-items:center;padding:0 14px;font-size:12px;color:#6B6056;">Message</span>
              <span style="flex:0 0 34px;height:34px;border-radius:50%;background:#141210;"></span>
            </div>
          </div>
        </div>
        <figcaption style="font-size:12px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;color:#D9D0C4;">WhatsApp · Confirmation, then Esi</figcaption>
      </figure>

      <figure style="margin:0;display:flex;flex-direction:column;gap:14px;">
        <div style="width:300px;height:620px;box-sizing:border-box;border-radius:40px;padding:10px;background:#141210;border:1px solid rgba(217,208,196,0.3);">
          <div style="position:relative;width:100%;height:100%;border-radius:31px;overflow:hidden;background:#FFFFFF;color:#141210;display:flex;flex-direction:column;">
            <div style="flex-shrink:0;display:flex;align-items:center;gap:10px;padding:40px 14px 10px;">
              <span style="flex:0 0 32px;height:32px;border-radius:50%;background:#141210;color:#F6F1EA;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:8px;letter-spacing:0.2em;padding-left:0.2em;box-sizing:border-box;box-shadow:0 0 0 2px #FFFFFF, 0 0 0 3px #A8865A;">IVIÉ</span>
              <span style="flex:1;display:flex;flex-direction:column;gap:1px;"><span style="font-size:12px;font-weight:600;">ivie.accra</span><span style="font-size:10px;color:#6B6056;">East Legon, Accra</span></span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg>
            </div>
            <div style="position:relative;flex-shrink:0;aspect-ratio:4/5;background:#D9D0C4;">
              <img src="https://images.pexels.com/photos/6766741/pexels-photo-6766741.jpeg?auto=compress&amp;cs=tinysrgb&amp;w=700" alt="A client in ivory silk" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 25%;filter:saturate(0.9) contrast(1.02) sepia(0.06);">
              <button onClick="{{ openSheet }}" style="position:absolute;left:28%;top:52%;display:flex;align-items:center;gap:6px;padding:6px 10px;background:rgba(20,18,16,0.78);color:#F6F1EA;border:0;border-radius:4px;cursor:pointer;font-family:'Manrope',sans-serif;font-size:10px;font-weight:500;"><span style="width:6px;height:6px;border-radius:50%;background:#F6F1EA;"></span>Adwoa Silk Slip Dress · GHS 3,850</button>
            </div>
            <button onClick="{{ openSheet }}" style="flex-shrink:0;display:flex;align-items:center;justify-content:space-between;min-height:44px;padding:0 14px;background:#141210;color:#F6F1EA;border:0;cursor:pointer;font-family:'Manrope',sans-serif;font-size:12px;font-weight:600;">Shop now<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><polyline points="9 5 16 12 9 19"></polyline></svg></button>
            <div style="flex-shrink:0;display:flex;gap:14px;padding:10px 14px 6px;">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10.2A4.2 4.2 0 0 1 12 7.4a4.2 4.2 0 0 1 7.5 2.4C19.5 15.4 12 20 12 20z"></path></svg>
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4.5 20l1.2-3.7A8 8 0 1 1 8.4 19z"></path></svg>
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M21 3L3 10l7 3 3 7z"></path></svg>
            </div>
            <div style="flex:1;display:flex;flex-direction:column;gap:4px;padding:0 14px;font-size:12px;line-height:1.45;">
              <span style="font-weight:600;">Liked by abena.darko and 1,204 others</span>
              <span><strong style="font-weight:600;">ivie.accra</strong> Champagne silk, cut on the bias in Accra. In store at East Legon this week. Tap the piece to shop.</span>
            </div>
