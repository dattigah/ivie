<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Ivié · Mobile preview</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#2B211B;}
a{color:#F6F1EA;}
a:hover{color:#D9D0C4;}
:focus-visible{outline:2px solid #A8865A;outline-offset:3px;}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:1ms !important;animation-delay:0ms !important;animation-iteration-count:1 !important;transition-duration:1ms !important;scroll-behavior:auto !important;}}
</style>
</helmet>
<div style="min-height:100vh;background:#2B211B;color:#F6F1EA;font-family:'Manrope',sans-serif;display:flex;flex-direction:column;align-items:center;gap:24px;padding:32px 16px 48px;box-sizing:border-box;">
  <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;width:100%;max-width:420px;">
    <div style="display:flex;flex-wrap:wrap;gap:4px;"><sc-for list="{{ pages }}" as="pg" hint-placeholder-count="3"><button onClick="{{ pg.go }}" aria-pressed="{{ pg.onStr }}" style="min-height:36px;padding:0 12px;background:{{ pg.bg }};color:{{ pg.fg }};border:1px solid #D9D0C4;border-radius:2px;cursor:pointer;font-family:'Manrope',sans-serif;font-size:11px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;">{{ pg.label }}</button></sc-for></div>
    <div style="display:flex;gap:20px;">
      <a href="{{ src }}" style="display:inline-flex;align-items:center;min-height:44px;font-size:13px;text-decoration:none;"><span style="border-bottom:1px solid #A8865A;padding-bottom:3px;">Desktop view</span></a>
      <a href="/prototype-hub" style="display:inline-flex;align-items:center;min-height:44px;font-size:13px;text-decoration:none;"><span style="border-bottom:1px solid #A8865A;padding-bottom:3px;">Hub</span></a>
    </div>
  </div>
  <div style="width:410px;height:864px;box-sizing:border-box;border-radius:36px;padding:10px;background:#141210;border:1px solid rgba(217,208,196,0.3);flex-shrink:0;">
    <iframe src="{{ src }}" title="Ivié at mobile size" style="width:100%;height:100%;border:0;border-radius:28px;background:#F6F1EA;display:block;"></iframe>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const PAGES = [['Home', '/'], ['Shop', '/shop'], ['Product', '/product?p=adwoa-silk-slip-dress'], ['Checkout', '/checkout?client=efua'], ['Reserve', '/checkout?mode=reserve&p=adwoa-silk-slip-dress&c=Champagne&s=M&store=East%20Legon'], ['Atelier', '/atelier'], ['Custom', '/custom-request'], ['Tracker', '/custom-tracker'], ['Stores', '/our-stores'], ['Book', '/book-a-visit'], ['Sign in', '/sign-in'], ['Join', '/sign-in?mode=join'], ['Account', '/account'], ['Membership', '/account?v=loyalty'], ['App', '/ivie-app']];
class Component extends DCLogic {
  state = (() => { let k = 'Home'; try { k = new URLSearchParams(location.search).get('page') || 'Home'; } catch (e) {} return { k }; })();
  renderVals() {
    const cur = PAGES.find(p => p[0] === this.state.k) || PAGES[0];
    return {
      src: cur[1],
      pages: PAGES.map(([label]) => { const on = label === cur[0]; return { label, onStr: String(on), bg: on ? '#F6F1EA' : 'transparent', fg: on ? '#141210' : '#F6F1EA', go: () => { this.setState({ k: label }); try { history.replaceState(null, '', '?page=' + label); } catch (e) {} } }; })
    };
  }
}
</script>
</body>
</html>
